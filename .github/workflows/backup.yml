name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install MySQL client
        run: sudo apt-get install -y mysql-client

      - name: Create CA cert file
        run: |
          echo "${{ secrets.DB_CA_CERT }}" > ca.pem

      - name: Create backup
        run: |
          mysqldump --host=${{ secrets.DB_HOST }} --port=${{ secrets.DB_PORT }} --user=${{ secrets.DB_USER }} --password=${{ secrets.DB_PASSWORD }} --ssl-mode=VERIFY_IDENTITY --ssl-ca=ca.pem ${{ secrets.DB_NAME }} > backup_$(date +%Y%m%d).sql
      
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backup_*.sql